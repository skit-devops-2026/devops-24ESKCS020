name: CI

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check project structure
        run: |
          test -d backend
          test -d frontend
          test -f docker-compose.yml
          test -f README.md

      - name: Validate Docker Compose
        run: docker compose config
