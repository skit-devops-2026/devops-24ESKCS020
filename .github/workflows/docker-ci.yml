name: Docker CI

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Build the Docker image
        run: docker build -t todo-practice .

      - name: Run tests inside the container
        run: docker run --rm todo-practice npm test

      - name: Tag the image with the commit SHA
        run: docker tag todo-practice todo-practice:${{ github.sha }}

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Tag and push to GHCR
        run: |
          IMAGE_ID=$(echo "ghcr.io/${{ github.repository_owner }}/todo-practice" | tr '[:upper:]' '[:lower:]')
          docker tag todo-practice "$IMAGE_ID:${{ github.sha }}"
          docker tag todo-practice "$IMAGE_ID:latest"
          docker push "$IMAGE_ID:${{ github.sha }}"
          docker push "$IMAGE_ID:latest"
