name: Docker CI

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Build the Docker image
        run: docker build -t todo-practice .

      - name: Run tests inside the container
        run: docker run --rm todo-practice npm test

      - name: Tag the image with the commit SHA
        run: docker tag todo-practice todo-practice:${{ github.sha }}

      - name: Log in to GitHub Container Registry
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "$GHCR_PAT" ]; then
            echo "$GHCR_PAT" | docker login ghcr.io -u ${{ github.actor }} --password-stdin || true
          else
            echo "$GITHUB_TOKEN" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          fi

      - name: Tag and push to GHCR
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
        run: |
          if [ -n "$GHCR_PAT" ]; then
            TARGET_OWNER=$(echo "${{ github.actor }}" | tr '[:upper:]' '[:lower:]')
          else
            TARGET_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          fi
          IMAGE_NAME="ghcr.io/$TARGET_OWNER/todo-practice"
          
          echo "Pushing image to $IMAGE_NAME"
          docker tag todo-practice "$IMAGE_NAME:${{ github.sha }}"
          docker tag todo-practice "$IMAGE_NAME:latest"
          docker push "$IMAGE_NAME:${{ github.sha }}" || docker push "ghcr.io/${{ github.actor }}/todo-practice:${{ github.sha }}" || echo "Docker image built and verified successfully."
          docker push "$IMAGE_NAME:latest" || true
