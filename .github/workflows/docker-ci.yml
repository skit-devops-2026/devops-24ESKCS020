name: Docker CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the Docker image
        run: docker build -t devops-24eskcs020 .

      - name: Run tests inside the container
        run: docker run --rm devops-24eskcs020 npm test

      - name: Set lowercased repo names
        run: |
          echo "IMAGE_REPO=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
          echo "REPO_OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push to GHCR
        run: |
          echo "Pushing image to ghcr.io/${IMAGE_REPO}"
          docker tag devops-24eskcs020 "ghcr.io/${IMAGE_REPO}:latest"
          docker tag devops-24eskcs020 "ghcr.io/${IMAGE_REPO}:${{ github.sha }}"
          docker push "ghcr.io/${IMAGE_REPO}:latest"
          docker push "ghcr.io/${IMAGE_REPO}:${{ github.sha }}"

          if [ "${IMAGE_REPO}" != "skit-devops-2026/devops-24eskcs020" ] && [ "${REPO_OWNER}" = "skit-devops-2026" ]; then
            docker tag devops-24eskcs020 "ghcr.io/skit-devops-2026/devops-24eskcs020:latest"
            docker tag devops-24eskcs020 "ghcr.io/skit-devops-2026/devops-24eskcs020:${{ github.sha }}"
            docker push "ghcr.io/skit-devops-2026/devops-24eskcs020:latest" || true
            docker push "ghcr.io/skit-devops-2026/devops-24eskcs020:${{ github.sha }}" || true
          fi
